<!doctype html>
<html><head><meta charset="utf-8"><title>subscribe-like-hype</title>
<style>
html,body{margin:0;background:#00FF00;overflow:hidden}
svg{display:block}
text{font-family:"WenQuanYi Zen Hei","Noto Sans CJK KR","Malgun Gothic",sans-serif;font-weight:800}
</style></head><body>
<svg id="s" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
<rect width="1920" height="1080" fill="#00FF00"/>
<defs>
<linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8A2BE2"/><stop offset="1" stop-color="#FF2D95"/></linearGradient>
</defs>
<g id="root"></g>
</svg>
<script>
const NS="http://www.w3.org/2000/svg", root=document.getElementById('root');
const P={thumb:"M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z",
bell:"M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z",
bolt:"M7 2v11h3v9l7-12h-4l4-8z"};
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const eOut=t=>1-Math.pow(1-t,3);
const eIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eBack=t=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const seg=(t,a,b)=>clamp((t-a)/(b-a));
function el(n,a,p=root){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e}

const EN=new URLSearchParams(location.search).get('lang')==='en';
const CX=EN?[440,960,1480]:[560,960,1360], CY=540, W=EN?480:340, H=130, T0=[0.3,2.0,3.7], CLICK=[1.15,2.85,4.55], END=5.7, DUR=6.4;
const seed=n=>{let x=Math.sin(n*127.1)*43758.5453;return x-Math.floor(x)};

function pill(i,t){
  const g=el('g',{});
  const appear=eBack(seg(t,T0[i],T0[i]+.55));
  const out=1-eIO(seg(t,END,END+.5));
  let sc=appear*out; if(sc<=0.001) return;
  const since=t-CLICK[i];
  const press = since>-0.12&&since<0.12 ? 1-0.1*Math.cos(clamp(since/0.12)*Math.PI/2) : 1; // dip at click
  const pop = since>=0 ? 1+0.12*Math.sin(clamp(since/0.5)*Math.PI) : 1;
  const done=since>=0;
  const y=CY+(1-seg(t,T0[i],T0[i]+.4))*70;
  g.setAttribute('transform',`translate(${CX[i]},${y}) scale(${sc*press*pop})`);
  let bg,fg,label,icon;
  if(i===0){bg=done?'#272727':'#FF0000';fg='#fff';label=EN?(done?'Subscribed':'Subscribe'):(done?'구독중':'구독');icon=done?P.bell:null}
  if(i===1){bg='#fff';fg='#111';label=EN?'Like':'좋아요';icon=P.thumb}
  if(i===2){bg=done?'url(#hg)':'#222';fg='#fff';label=EN?'Hype':'하이프';icon=P.bolt}
  el('rect',{x:-W/2,y:-H/2,width:W,height:H,rx:H/2,fill:bg},g);
  const ig=el('g',{},g);
  let ix=-W/2+44, iy=-36, is=3, rot=0, ifill=fg;
  if(i===0&&done){const k=since; rot=k<1?Math.sin(k*28)*22*(1-k):0}
  if(i===1){ifill=done?'#3EA6FF':'#111'; if(done){is=3*(1+0.5*Math.sin(clamp(since/0.45)*Math.PI)); rot=-12*Math.sin(clamp(since/0.45)*Math.PI)}}
  if(i===2){ifill=done?'#FFE14D':'#fff'}
  if(icon){
    ig.setAttribute('transform',`translate(${ix+36},${0}) rotate(${rot}) scale(${is}) translate(-12,-12)`);
    el('path',{d:icon,fill:ifill},ig);
    ig.firstChild.setAttribute('transform','');
  }
  const tx=icon? (EN?58:38) : 0;
  const txt=el('text',{x:tx,y:20,'text-anchor':'middle','font-size':EN?46:56,fill:fg,style:EN?'font-family:"DejaVu Sans","Liberation Sans",Arial,sans-serif':''},g);
  txt.textContent=label;
  // effects
  if(done){
    const k=since;
    const r=el('circle',{cx:0,cy:0,r:lerp(60,260,eOut(clamp(k/0.7))),fill:'none',stroke:i===0?'#FF4D4D':i===1?'#3EA6FF':'#FF2D95','stroke-width':lerp(14,0,clamp(k/0.7)),opacity:1-clamp(k/0.7)},g);
    if(i!==0){
      const cols=i===1?['#3EA6FF','#fff','#FFE14D','#FF2D95']:['#FFE14D','#FF2D95','#8A2BE2','#fff','#FF9F1C'];
      for(let n=0;n<(i===1?10:18);n++){
        const a=seed(n+i*50)*Math.PI*2, v=140+seed(n+9+i*50)*260, p=eOut(clamp(k/0.9));
        const px=Math.cos(a)*v*p, py=Math.sin(a)*v*p+ (k>0.3?(k-0.3)*(k-0.3)*160:0);
        const s=lerp(i===1?16:20,0,clamp(k/1.0));
        if(s>0.5) el(n%2?'rect':'circle',n%2?{x:px-s/2,y:py-s/2,width:s,height:s,fill:cols[n%cols.length],transform:`rotate(${n*40+k*300} ${px} ${py})`}:{cx:px,cy:py,r:s/2,fill:cols[n%cols.length]},g);
      }
    }
    if(i===0){ // bell alert ticks
      for(let n=0;n<2;n++){const f=clamp((k-n*0.15)/0.5); if(f>0&&f<1) el('path',{d:`M ${-W/2+10-n*18} -20 q -14 20 0 40`,fill:'none',stroke:'#fff','stroke-width':6,'stroke-linecap':'round',opacity:1-f},g)}
    }
  }
}
function cursor(t){
  const pts=[[1500,950,0.0]];
  for(let i=0;i<3;i++) pts.push([CX[i]+40,CY+30,CLICK[i]]);
  let x,y;
  if(t<pts[1][2]){const p=eIO(seg(t,pts[1][2]-0.7,pts[1][2])); x=lerp(1500,pts[1][0],p); y=lerp(950,pts[1][1],p)}
  else{x=pts[1][0];y=pts[1][1];
    for(let i=1;i<3;i++){const p=eIO(seg(t,CLICK[i-1]+0.25,CLICK[i])); if(t>=CLICK[i-1]+0.25){x=lerp(pts[i][0],pts[i+1][0],p);y=lerp(pts[i][1],pts[i+1][1],p)}}}
  let s=1.7, a=1-eIO(seg(t,END-0.2,END+.3));
  for(let i=0;i<3;i++){const d=t-CLICK[i]; if(Math.abs(d)<0.12) s*=1-0.12*Math.cos(clamp(Math.abs(d)/0.12)*Math.PI/2)}
  const vis=Math.min(1,seg(t,CLICK[0]-1.0,CLICK[0]-0.7));
  if(a*vis<=0.01) return;
  const g=el('g',{transform:`translate(${x},${y}) scale(${s})`,opacity:a*vis});
  el('path',{d:'M0 0 L0 26 L7 20 L12 31 L17 29 L12 18 L21 18 Z',fill:'#fff',stroke:'#111','stroke-width':2.5,'stroke-linejoin':'round'},g);
}
window.setTime=function(t){ root.innerHTML=''; for(let i=0;i<3;i++) pill(i,t); cursor(t); };
window.DUR=DUR; setTime(0);
</script></body></html>
